# Configure Python virtual environments (`venv`) and integrate them with Apache web server deployment settings.
# Create and populate a virtual environment on Windows:
#   python -m venv C:\webapps\python_web_db\venv
#   C:\webapps\python_web_db\venv\Scripts\python.exe -m pip install mysql-connector-python

# In each CGI script, use the venv interpreter on its first line:
#   #!C:/webapps/python_web_db/venv/Scripts/python.exe
# Enable CGI and configure the CGI directory in Apache's main httpd.conf:
LoadModule cgi_module modules/mod_cgi.so
ScriptInterpreterSource Script

<Directory "C:/Apache24/cgi-bin">
    Require all granted
    Options +ExecCGI
    AddHandler cgi-script .py
</Directory>

# Place the CGI scripts in C:/Apache24/cgi-bin, then restart Apache.
# In production, restrict the CGI directory and set MYSQL_* variables for the
# Apache service account rather than putting credentials in these files.
