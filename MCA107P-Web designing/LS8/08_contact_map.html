<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Responsive contact map embed example</title><link rel="stylesheet" href="03_responsive_layout.css"></head>
<body>
  <main class="section">
    <!-- Implement Google Maps embedding and responsive styling on the client's contact page. -->
    <h1>Responsive contact-map example</h1>
    <p>This accessible, lazy-loaded embed shows a generic Portland map for the fictional Juniper &amp; Grain prototype, not an actual business pin.</p>
    <div class="map-frame">
      <iframe title="Map showing Portland, Oregon (demo location)" src="https://maps.google.com/maps?q=Portland%2C%20Oregon&t=&z=12&ie=UTF8&iwloc=&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      <p><a href="https://maps.google.com/?q=Portland%2C%20Oregon" target="_blank" rel="noopener noreferrer">Open Portland in Google Maps</a></p>
    </div>
  </main>
</body>
</html>
