# Configure Apache `.htaccess` files and handler directives to execute Python scripts seamlessly within web directories.
# Enable mod_cgi (or mod_cgid) in Apache's main configuration and allow the directives below:
# <Directory "C:/path/to/web-directory">
#     AllowOverride Options FileInfo
#     Require all granted
# </Directory>

Options +ExecCGI
AddHandler cgi-script .py
